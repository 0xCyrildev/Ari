# Ari on Pxxl — one project, three services.
#
# THIS FILE DESCRIBES THE PAID SHAPE. `Multiple Services` is a Plus feature, and on the
# Free plan a project is one service, so Pxxl finds no saved service whose alias matches
# `[services.*]` and these tables change nothing. What ships today is therefore three
# single-service projects — `ari-web`, `ari-api`, `ari-signer` — whose working directory,
# commands, ports and environment must be typed into each project's dashboard form; the
# exact values are in `AGENTS.md`, "State — 2026-09-28 (sixth pass)". The consequence of
# that shape is the one this repository now carries in code: `ari-signer` gets a public
# hostname, so `SIGNER_DELIVERY_KEY` is what stands between a stranger and `/v1/sign`
# besides the seal, and it is *required* the moment the signer binds beyond loopback.
#
# These tables pin the *build* only. A service alias here must match a service saved on
# the project, and Pxxl applies it to that service alone. The public route, the service
# type and the replica count are not overridable in this file: they are project settings
# in the dashboard, and the shape this deployment depends on is `web` routed, `api`
# routed, and `signer` with **Route: No** — because `signer` is the process that holds
# the sealing key, and Pxxl does not publish a hostname for an unrouted service.
#
# Secrets are not in this file and not in the repository. TICKET_KEY, CREDENTIAL_PEPPER,
# APPROVAL_KEY, ORG_BOOTSTRAP_TOKEN, SIGNER_DELIVERY_KEY, DATABASE_URL and SIGNER_WALLETS
# go in the project's environment settings, and both processes read plain environment
# variables: `--env-file-if-exists` makes the absence of a `.env` in a container a
# non-event.
#
# Each service must bind a routable interface, so `API_HOST` and `SIGNER_HOST` are set to
# 0.0.0.0 in the dashboard. Both processes print what that means when they start, which is
# the point rather than an obstacle.
#
# Replicas stay at 1 for every service. `ari-api` serialises one tenant's requests behind
# a transaction-scoped advisory lock, and a second replica multiplies pools against a
# design measured at p50 ~30 ms per request rather than solving anything.

[build]
packageManager = "pnpm"
# The workspace declares `engines.node >= 24`; the platform's default is not this
# repository's business to assume.
nodeVersion = "24"

[services.web]
baseDirectory = "apps/web"
framework = "nextjs"
packageManager = "pnpm"
runtimeVersion = "24"
# apps/web is its own pnpm project — own lockfile, own workspace file, deliberately
# outside the root workspace so a Next build never enters `pnpm typecheck` or `pnpm test`.
installCommand = "pnpm install --frozen-lockfile"
buildCommand = "next build"
startCommand = "pnpm run start"
port = 3000

[services.api]
baseDirectory = "apps/api"
packageManager = "pnpm"
runtimeVersion = "24"
# The workspace installs from the repository root; the service then runs its own script
# from its directory. `node --import tsx` finds tsx by walking up to the root
# node_modules, which is why `tsx` is a dependency and not a devDependency here.
installCommand = "cd ../.. && pnpm install --frozen-lockfile"
buildCommand = ""
startCommand = "pnpm run start"
port = 4000

[services.signer]
baseDirectory = "apps/signer"
packageManager = "pnpm"
runtimeVersion = "24"
installCommand = "cd ../.. && pnpm install --frozen-lockfile"
buildCommand = ""
# Answers GET /healthz for the platform's readiness check and POST /v1/sign for
# everything else; 404 for the rest, by design.
startCommand = "pnpm run start"
port = 4100
