name: ari

services:
  postgres:
    image: postgres:16-alpine
    container_name: ari-postgres
    environment:
      POSTGRES_USER: ari
      POSTGRES_PASSWORD: ari
      POSTGRES_DB: ari
    # 5432 and 5433 are already bound on this host (system postgres + kuma).
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - ari-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ari -d ari']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ari-redis
    # NOT YET WIRED TO ANYTHING (measured 2026-10-24): no package depends on a Redis client and
    # no source file connects to this port, so the gateway rate limit this container was started
    # for does not exist yet. What still binds is ASSUMPTIONS A3's actual rule — no limit,
    # reservation or authorization state lives here — which is why an empty flush remains an
    # availability event and never a security one. Kept running so the day a limiter lands, the
    # port and this contract are already agreed.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6381:6379'

volumes:
  ari-pgdata:
