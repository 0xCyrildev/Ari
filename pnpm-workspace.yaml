packages:
  - 'packages/*'
  - 'apps/*'

# Deliberate refusals, not oversights. Prisma's postinstall downloads platform
# engines, and nothing in Phases 1-3 runs a migration yet — so no dependency
# executes code on install until something actually needs it. Revisit when
# prisma/schema.prisma lands.
allowBuilds:
  '@prisma/engines': false
  prisma: false
