packages:
  - 'packages/*'
  - 'apps/*'
  # The dashboard is excluded on purpose. An earlier version of this comment said the reason was
  # that the box could not reach the registry from Node; that was measured with `--offline`
  # probes and never by running an install, and it is false. The real reason is isolation: this is
  # a Vite/React/Tailwind app with its own toolchain (react 19, three, framer-motion, phosphor),
  # and inside the workspace its resolution would join the root lockfile, its build output would
  # join the workspace graph, and `tsc -p tsconfig.json` at the root would start type-checking
  # screens. The two commands that every other gate here depends on, `pnpm install` and
  # `pnpm typecheck`, should not have anything to do with a frontend. It is checked by
  # `pnpm typecheck:ui`, `pnpm ui:preflight` and `pnpm ui:build` instead, and it keeps its own
  # `node_modules`.
  - '!apps/dashboard'

# No dependency is permitted to run code at install time. A package that needs a
# build step gets named here deliberately, with the reason, rather than approved by
# whoever noticed the warning last.
#
# `esbuild` arrives as `tsx`'s dependency, and `tsx` is how the two processes are
# started on a Node built without TypeScript support (Debian's 24.x: `--experimental-
# strip-types` raises ERR_NO_TYPESCRIPT there). Its postinstall only re-checks a
# binary that the platform-specific package already shipped and that works untouched —
# verified here by running `node --import tsx` with the script ignored. So the answer
# is an explicit no, which is also the default: this keeps install-time code at zero
# and records that someone checked.

allowBuilds:
  esbuild: false
